# Magic Valley Digital Twin — study area and project configuration

study_area:
  # decimal degrees, confirmed on satellite imagery: pivot-irrigated farmland
  # northeast of Jerome, ID (dairies, creeks, no town)
  west: -114.58
  south: 42.77
  east: -114.52
  north: 42.81

years:
  start: 2008
  end: 2021  # Microsoft Planetary Computer's usda-cdl mirror covers 2008-2021 (conveniently
             # through our drought year); the original CropScape web service covers later
             # years too but was unreliable (timeouts/502s) when tested on 2026-10-22

drought_year: 2021  # to be confirmed against IDWR / Reclamation water-supply records

paths:
  raw_dem: data/raw/dem
  raw_cdl: data/raw/cdl
  raw_nass: data/raw/nass
  raw_budgets: data/raw/budgets
  raw_agrimet: data/raw/agrimet
  processed: data/processed

contracts:
  # Processor contracts cap how much acreage a grower can deliver each year, for
  # both sugar beets and potatoes (both are grown under processor contract in the
  # real Magic Valley, e.g. Amalgamated Sugar / Simplot-Lamb Weston-McCain). Without
  # these caps the optimizer recommends near-total potatoes every year -- the most
  # profitable crop per acre but never actually grown at that scale in real life
  # (field_history.csv shows historical potato acreage averaging ~255, peaking at
  # ~521, of our ~4,993 traced acres) -- which is exactly the degenerate "all
  # potatoes" outcome the build plan calls out.
  sugar_beet_acreage_cap: 750  # ~15% of traced acreage
  potato_acreage_cap: 600      # a bit above the historical peak (521 ac), for headroom
