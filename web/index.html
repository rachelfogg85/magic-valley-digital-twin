<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Magic Valley Digital Twin</title>
<style>
  :root {
    --forest: #1E5631;
    --forest-light: #e8f1ea;
    --ink: #2a2a2a;
    --muted: #6b6b6b;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: Arial, Helvetica, sans-serif; background: #ffffff; color: var(--ink); }
  canvas { display: block; }
  #ui {
    position: absolute; top: 16px; left: 16px; z-index: 10;
    background: #ffffff; padding: 16px 18px; border-radius: 10px;
    max-width: 280px; box-shadow: 0 2px 12px rgba(0,0,0,0.12); border: 1px solid #eee;
  }
  #ui h1 { font-size: 17px; margin: 0 0 10px; color: var(--forest); font-weight: 700; }
  #ui label { display: block; font-size: 13px; margin-top: 12px; color: var(--ink); }
  #ui input[type="range"] { width: 100%; accent-color: var(--forest); }
  #legend { margin-top: 14px; max-height: 220px; overflow-y: auto; font-size: 12px; }
  #legend h3 { font-size: 13px; margin: 0 0 6px; color: var(--forest); font-weight: 700; }
  .legend-row { display: flex; align-items: center; margin-bottom: 3px; }
  .swatch { display: inline-block; width: 12px; height: 12px; margin-right: 6px; border: 1px solid #0002; flex-shrink: 0; border-radius: 2px; }
  #disclaimer {
    margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--forest-light);
    font-size: 11px; color: var(--muted); font-style: italic;
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="ui">
  <h1>Magic Valley Digital Twin</h1>
  <label>Year: <span id="year-label"></span>
    <input type="range" id="year-slider" min="2008" max="2021" step="1" value="2021">
  </label>
  <label>Vertical exaggeration: <span id="exag-label"></span>
    <input type="range" id="exag-slider" min="1" max="10" step="0.5" value="4">
  </label>
  <div id="legend"></div>
  <div id="disclaimer">Decision aid, not farm advice.</div>
</div>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js"
  }
}
</script>
<script type="module" src="main.js"></script>
</body>
</html>
