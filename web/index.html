<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Magic Valley Digital Twin</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: sans-serif; }
  canvas { display: block; }
  #ui {
    position: absolute; top: 12px; left: 12px; z-index: 10;
    background: rgba(255,255,255,0.9); padding: 12px 16px; border-radius: 8px;
    max-width: 280px; box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  }
  #ui h1 { font-size: 16px; margin: 0 0 8px; }
  #ui label { display: block; font-size: 13px; margin-top: 10px; }
  #ui input[type="range"] { width: 100%; }
  #legend { margin-top: 12px; max-height: 220px; overflow-y: auto; font-size: 12px; }
  #legend h3 { font-size: 13px; margin: 0 0 4px; }
  .legend-row { display: flex; align-items: center; margin-bottom: 2px; }
  .swatch { display: inline-block; width: 12px; height: 12px; margin-right: 6px; border: 1px solid #0003; flex-shrink: 0; }
  #disclaimer {
    margin-top: 12px; padding-top: 8px; border-top: 1px solid #ccc;
    font-size: 11px; color: #555; font-style: italic;
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="ui">
  <h1>Magic Valley Digital Twin</h1>
  <label>Year: <span id="year-label"></span>
    <input type="range" id="year-slider" min="2008" max="2021" step="1" value="2021">
  </label>
  <label>Vertical exaggeration: <span id="exag-label"></span>
    <input type="range" id="exag-slider" min="1" max="10" step="0.5" value="4">
  </label>
  <div id="legend"></div>
  <div id="disclaimer">Decision aid, not farm advice.</div>
</div>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js"
  }
}
</script>
<script type="module" src="main.js"></script>
</body>
</html>
